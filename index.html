<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#315746"/>
  <meta name="description" content="MY EXPO BAG — 展示会で気になった商品をひとつのBAGに。"/>
  <title>MY EXPO BAG | Customer</title>
  <!-- Home screen icon: place myexpobag_icon.png next to index.html -->
  <link rel="icon" href="./myexpobag_icon.png" type="image/png"/>
  <link rel="apple-touch-icon" href="./myexpobag_icon.png"/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <meta name="apple-mobile-web-app-title" content="MY EXPO BAG"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <!-- Always check the current publication on launch. No service-worker asset cache. -->
  <script>
    (async () => {
      // Build ID is independent of the displayed app version (always v1.0.1).
      let build='20261014-recommend-refresh-01';
      try {
        const response=await fetch('./release.json?nocache='+Date.now(),{cache:'no-store'});
        if(response.ok){
          const release=await response.json();
          if(typeof release.build==='string' && /^[a-zA-Z0-9._-]{1,80}$/.test(release.build)) build=release.build;
        }
      } catch (_) { /* file:// preview or temporary offline: use bundled build */ }
      window.MEB_CURRENT_BUILD=build;
      const style=document.createElement('link');
      style.rel='stylesheet';
      style.href='./styles.css?build='+encodeURIComponent(build);
      document.head.appendChild(style);
      if(document.readyState==='loading') await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));
      for(const filename of ['config.js','qr.js','app.js']){
        try {
          await new Promise((resolve,reject)=>{
            const script=document.createElement('script');
            script.src='./'+filename+'?build='+encodeURIComponent(build);
            script.onload=resolve;script.onerror=()=>reject(new Error(filename));
            document.body.appendChild(script);
          });
        } catch(error){
          document.getElementById('view').textContent='読み込みに失敗しました。通信環境をご確認のうえ、ページを開き直してください。';
          break;
        }
      }
    })();
  </script>
</head>
<body>
  <div class="app-shell" id="app">
    <header class="site-header" id="site-header"></header>
    <main id="view" tabindex="-1"></main>
    <footer class="site-footer"><span>POWERED BY <strong>MY EXPO BAG</strong></span><span>v1.0.1</span></footer>
  </div>
  <div id="floating-bag" class="floating-bag-wrap" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
