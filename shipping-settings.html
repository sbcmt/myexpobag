</style><script defer src="./admin-refresh.js?asset=20261016-shipping-separate"></script><script defer src="./shipping-utils.js?asset=20261016-shipping-separate"></script></head><body><header class="top"><a href="./admin.html">← 管理</a><strong>予約配送料設定｜v1.0.1</strong></header><main class="wrap"><p id="loading" class="help" role="status">送料設定を読み込み中…</p><div id="shell" hidden><section class="card"><h2>予約配送料設定</h2>
<p class="help">予約商品を含む注文にのみ送料が適用されます。全国一律と都道府県別の設定値は切り替えても保持されます。</p>
<label class="radio switch-row"><input id="shipping-flat" type="checkbox"> 全国一律送料を使用する</label>
<div id="shipping-flat-panel" class="shipping-panel"><label for="shipping-charge">全国一律送料（税込・円）</label><input id="shipping-charge" type="number" min="0" max="100000" step="1" value="0"><p class="help">0円で送料当社負担となります。</p></div>
<div id="prefecture-shipping-fields" class="shipping-panel"><h3 style="margin:0 0 8px">都道府県別送料（税込）</h3><p class="help">CSVは「都道府県,送料」の2列。記載された都道府県のみ更新し、その他は保持します。47都道府県の登録に対応しています。</p>
<div class="csv-controls"><button type="button" id="shipping-csv-template">CSVを書き出す</button><label for="shipping-csv-file" class="csv-upload" id="shipping-csv-label">CSV一括登録<input id="shipping-csv-file" type="file" accept=".csv,text/csv"></label></div>
<p class="help" id="shipping-csv-result" role="status" aria-live="polite"></p><div id="shipping-prefecture-rates" class="prefecture-rate-grid"></div></div>
<div class="opt"><label for="shipping-threshold">送料当社負担となる購入金額の下限（税込・円／任意）</label><input id="shipping-threshold" type="number" min="0" max="100000000" step="1" placeholder="空欄または0＝下限なし"><p class="help">設定金額以上で送料0円。全国一律・都道府県別どちらにも適用します。</p></div>
</section><div class="save"><button id="save-shipping" disabled type="button">予約配送料設定を保存</button><p class="status" id="shipping-status" role="status" aria-live="polite"></p></div></div><p class="help" style="text-align:center">MY EXPO BAG · v1.0.1</p></main><script src="./firebase-config.js"></script><script type="module" src="./shipping-settings.js?asset=20261016-shipping-separate"></script><div class="meb-copyright">© 2021–2026 dobhar-chu</div></body></html>
