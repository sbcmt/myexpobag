<body>
<header class="top meb-admin-page-header"><strong class="meb-admin-page-title">アカウント情報</strong><a class="meb-admin-back" href="./admin.html">← 管理ページ</a></header>
<p class="loading" id="loading" role="status">アカウントを確認しています…</p>
<main class="wrap" hidden="" id="account-shell">
<section class="card">
<h1>アカウント情報</h1><p class="help">ブランド名・登録情報の確認と変更ができます。</p>
<div class="avatar-zone">
<div aria-label="ブランドアイコン" class="avatar" id="brand-avatar" role="img">
<svg aria-hidden="true" viewbox="0 0 64 64"><circle cx="32" cy="23" r="13"></circle><path d="M7 60c0-13.5 11.2-23 25-23s25 9.5 25 23z"></path></svg>
</div>
<strong style="font-size:13px">ブランドアイコン</strong>
<div class="avatar-actions">
<label class="upload-button">画像を登録・変更<input accept="image/*" aria-label="ブランドアイコンの画像を選択" id="brand-icon-file" type="file"/></label>
<button class="light-button" id="remove-icon" type="button">画像を解除</button>
</div>
<p class="note" style="text-align:center">推奨：JPG・PNG・WebP／15MB以下</p>
</div>
<form id="brand-form">
<div class="field"><label for="display-name">ブランド名（表示用・変更可能）</label><input autocomplete="organization" id="display-name" maxlength="100" placeholder="日本語・英語どちらでも入力できます" required="" type="text"/></div>
<div class="field">
<label style="display:flex;align-items:center;gap:8px"><input id="operator-same" style="width:auto;min-height:auto" type="checkbox"/>運営者名はブランド名と同じ</label>
<label for="operator-name">運営会社・運営者名（必須）</label>
<input autocomplete="organization" id="operator-name" maxlength="120" placeholder="法人名または個人事業の運営者名" required="" type="text"/>
</div>

<div class="field"><label for="brand-slug">アカウントのブランド名（URL識別子・変更不可）</label><input id="brand-slug" readonly="" type="text"/></div>
<div class="field"><label for="account-email">メールアドレス</label><input id="account-email" readonly="" type="email"/></div>
<div class="field"><label for="account-password">パスワード</label><input id="account-password" readonly="" type="text" value="********"/></div>
<button class="primary" disabled="" id="save-brand" type="submit">ブランド情報を保存</button>
<p aria-live="polite" class="status" id="brand-status" role="status"></p>
</form>
</section>
<section class="card">
<h2>ログイン情報の変更</h2>
<button aria-controls="email-panel" aria-expanded="false" class="change" id="toggle-email" type="button">メールアドレスを変更 <span aria-hidden="true">›</span></button>
<div class="change-panel" hidden="" id="email-panel">
<form id="email-form">
<div class="field"><label for="new-email">新しいメールアドレス</label><input autocomplete="email" id="new-email" maxlength="254" required="" type="email"/></div>
<div class="field"><label for="email-current-password">現在のパスワード（本人確認）</label><input autocomplete="current-password" id="email-current-password" required="" type="password"/></div>
<button class="primary" id="save-email" type="submit">確認メールを送る</button>
<p class="help">新しいメールアドレスに確認リンクを送ります。リンクを開くと変更が確定します。</p>
<p aria-live="polite" class="status" id="email-status" role="status"></p>
</form>
</div>
<button aria-controls="password-panel" aria-expanded="false" class="change" id="toggle-password" type="button">パスワードを変更 <span aria-hidden="true">›</span></button>
<div class="change-panel" hidden="" id="password-panel">
<form id="password-form">
<div class="field"><label for="password-current">現在のパスワード（本人確認）</label><input autocomplete="current-password" id="password-current" required="" type="password"/></div>
<div class="field"><label for="new-password">新しいパスワード</label><input autocomplete="new-password" id="new-password" minlength="8" required="" type="password"/></div>
<div class="field"><label for="confirm-password">新しいパスワード（確認）</label><input autocomplete="new-password" id="confirm-password" required="" type="password"/></div>
<p class="help">8文字以上・英大文字・英小文字・数字・記号（@ &amp; - _ のいずれか）が必要です。</p>
<button class="primary" id="save-password" type="submit">パスワードを変更</button>
<p aria-live="polite" class="status" id="password-status" role="status"></p>
</form>
</div>
</section>
<footer>MY EXPO BAG · v1.0.1</footer>
</main>
